<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f1e8" />
    <title>呐喊跳跳</title>
  </head>
  <body>
    <main class="app">
      <header class="status-bar" aria-live="polite">
        <span id="game-status">准备开始</span>
        <span>分数：<strong id="score">0</strong></span>
      </header>

      <canvas id="game" aria-label="呐喊跳跳游戏画面：点击起跳，空中再点二段跳，落上平台恢复次数" tabindex="0"></canvas>

      <section class="controls">
        <button id="start-button" type="button">开启麦克风并开始</button>
        <button id="restart-button" type="button" hidden>重新开始</button>
        <div class="meter" aria-label="当前声音能量">
          <div id="meter-fill" class="meter__fill"></div>
          <div id="threshold-mark" class="meter__threshold"></div>
        </div>
        <p id="audio-status">点击／空格起跳，空中松开再按可喷气二段跳；第一跳长按可增高。横向木平台可落脚，固定尖刺和来回巡逻的负鼠、蜗牛都要跳过。动物到边界会转身，房屋和植物只是背景；每局随机组合，右上角显示难度阶段。声控仍需安静后再次发声，尚未加入专用鼓掌识别。</p>
      </section>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
